  <!DOCTYPE html>
  <html lang="ru">
  <head>
    
    <meta charset="UTF-8">
    <title>Game Page</title>
    <link rel="stylesheet" href="../Styles/game-page.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  </head>
  <body>

    <div class="game-page">

    <button id="back-btn" class="back-btn">← Назад</button>

    <div class="top-section">

      <div class="left-cover">
        <img id="main-image" class="main-image" src="none.jpg" alt="Обложка игры">
      </div>

      <div class="right-info">
        <h1 id="title">Загрузка...</h1>

        <div class="info">
          <h2>Жанры</h2>
          <p id="genres"></p>

          <h2>Описание</h2>
          <p id="description"></p>
        </div>

        <button id="install-btn" class="install-btn">Установить</button>
      </div>

    </div>
  <p></p>
    <div class="screenshot-viewer">
      <img id="big-screenshot" class="big-screenshot" src="none.jpg" alt="Скриншот игры">
    </div>

    <div id="carousel" class="carousel"></div>

  </div>

    <footer class="footer">
    <div class="footer-content">
      <p>Некоммерческий архив компьютерных игр. Материалы предоставлены в ознакомительных целях.</p>

      <div class="footer-contacts">
        <p>+52 542 32 10</p>
        <p>archivpirata@mail.ru</p>
      </div>
    </div>
  </footer>
    
    <script src="/Site/JS/game.js"></script>
  </body>
  </html>
